name: Deploy Worker

# Auto-deploy the Trip Command Center to Cloudflare on every push to the
# active branch. `claude/new-session-tqvlk0` is the repo's current default
# branch; `main` is included so this keeps working if the project is later
# promoted to a conventional `main`. Manual runs: the "Run workflow" button.
on:
  push:
    branches: [claude/new-session-tqvlk0, main]
    paths:
      - "src/**"
      - "public/**"
      - "migrations/**"
      - "wrangler.jsonc"
      - "package.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Never run two deploys at once; a newer push supersedes an in-flight one.
concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      # Deploys the Worker and uploads the ANTHROPIC_API_KEY as a Worker secret.
      # The D1 schema + seed are applied once by hand in the Cloudflare D1
      # console (see migrations/setup-db.sql / DEPLOY.md), so the deploy token
      # only needs Workers Scripts: Edit — no D1 API permission required.
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN_Trip_Planner }}
          command: deploy
          secrets: |
            ANTHROPIC_API_KEY
        env:
          # The Worker secret must be named ANTHROPIC_API_KEY (worker.js reads
          # env.ANTHROPIC_API_KEY); its value comes from the GitHub secret the
          # user created, CLAUDE_API_TRIP_PLANNER.
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_API_TRIP_PLANNER }}
