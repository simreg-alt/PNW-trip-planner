name: Deploy Worker

# Auto-deploy the Trip Command Center to Cloudflare on every push to the
# default branch. Manual runs are available via the "Run workflow" button.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "migrations/**"
      - "wrangler.jsonc"
      - "package.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Never run two deploys at once; a newer push supersedes an in-flight one.
concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      # Applies any un-applied D1 migrations, then deploys the Worker.
      # Requires the D1 database to exist and its id to be filled into
      # wrangler.jsonc (see DEPLOY.md). Migration apply is idempotent.
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: wrangler d1 migrations apply regal-trip --remote
          command: deploy
