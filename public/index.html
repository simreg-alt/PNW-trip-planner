<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Regal Family Trip Command Center</title>
<meta name="theme-color" content="#2E4A3A" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Trip" />
<style>
  :root{
    --bg:#F2F4F0; --card:#fff; --ink:#182A20; --sub:#5C6B60; --pine:#2E4A3A;
    --pineSoft:#E4EBE4; --border:#D9DFD6; --amber:#B96A1B; --amberSoft:#F7ECDD;
    --rust:#A8442E; --rustSoft:#F6E6E1; --gold:#8A6A1F; --goldSoft:#FBF3DC; --goldBorder:#E8D9A8;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:Georgia,'Times New Roman',serif;-webkit-font-smoothing:antialiased}
  .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
  .wrap{max-width:720px;margin:0 auto;padding:20px 16px 120px}
  h1{font-size:1.7rem;line-height:1.2;margin:.2em 0}
  .kicker{font-family:ui-monospace,Menlo,monospace;font-size:.72rem;letter-spacing:.08em;
    text-transform:uppercase;color:var(--pine)}
  .toplinks{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
  .tlink{display:inline-block;font-family:ui-monospace,Menlo,monospace;font-size:.74rem;
    color:var(--pine);background:var(--pineSoft);border:0;border-radius:8px;padding:6px 10px;
    cursor:pointer;text-decoration:none}
  .tlink:hover{background:#d7e0d7}
  .tabs{display:flex;gap:4px;background:var(--pineSoft);padding:4px;border-radius:12px;margin:18px 0}
  .tab{flex:1;border:0;background:transparent;color:var(--sub);font-weight:600;font-size:.9rem;
    padding:9px;border-radius:9px;cursor:pointer;font-family:inherit}
  .tab.active{background:#fff;color:var(--pine);box-shadow:0 1px 4px rgba(24,42,32,.1)}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:12px}
  .day-head{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer}
  .day-head .t{flex:1}
  .date{font-family:ui-monospace,Menlo,monospace;font-size:.72rem;color:var(--sub)}
  .title{font-weight:600;font-size:.95rem}
  .badge{font-family:ui-monospace,Menlo,monospace;font-size:.68rem;font-weight:700;
    padding:2px 8px;border-radius:99px}
  .b-planned{background:var(--pineSoft);color:var(--pine)}
  .b-partial{background:var(--amberSoft);color:var(--amber)}
  .b-missing{background:var(--rustSoft);color:var(--rust)}
  .b-shabbat{background:var(--goldSoft);color:var(--gold)}
  .b-booked{background:var(--pineSoft);color:var(--pine)}
  .b-backup{background:var(--amberSoft);color:var(--amber)}
  .stay{margin:0 16px 12px;padding:9px 11px;background:var(--pineSoft);border-radius:9px;
    font-size:.88rem;line-height:1.45;user-select:text}
  .shabbat .stay{background:#F4EBCF}
  .stay-l{font-family:ui-monospace,Menlo,monospace;font-size:.66rem;text-transform:uppercase;
    letter-spacing:.05em;color:var(--pine);font-weight:700}
  .stay-a{font-size:.83rem;margin-top:2px}
  .sitepill{display:inline-block;font-family:ui-monospace,Menlo,monospace;font-size:.7rem;font-weight:700;
    background:#fff;border:1px solid var(--border);border-radius:6px;padding:1px 6px;margin-left:4px}
  .day-body{padding:0 16px 14px;user-select:text}
  .ev{display:flex;gap:12px;margin:10px 0}
  .ev .tm{width:74px;flex:none;text-align:right;font-family:ui-monospace,Menlo,monospace;
    font-size:.72rem;color:var(--sub);padding-top:2px}
  .ev .bd{flex:1;border-left:1px solid var(--border);padding-left:12px}
  .ev .lb{font-size:.88rem;font-weight:500}
  .ev .nt{font-size:.85rem;color:var(--sub);margin-top:2px}
  a{color:var(--pine)}
  .item{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-top:1px solid var(--border)}
  .item:first-child{border-top:0}
  .shabbat{background:var(--goldSoft);border-color:var(--goldBorder)}
  /* inline edit controls */
  .chk{background:none;border:1.5px solid var(--pine);color:var(--pine);width:22px;height:22px;
    border-radius:50%;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;
    font-size:.8rem;line-height:1;padding:0}
  .chk:hover{background:var(--pineSoft)}
  .rowbtn{background:none;border:0;color:var(--sub);font-size:.95rem;cursor:pointer;padding:4px 6px;line-height:1}
  .rowbtn:hover{color:var(--pine)}
  .rowbtn.del:hover{color:var(--rust)}
  .itembtns{display:flex;align-items:center;gap:1px}
  .additem{display:flex;gap:6px;padding:11px 14px;border-top:1px solid var(--border);
    align-items:center;flex-wrap:wrap}
  .additem input{flex:1;min-width:150px;border:1px solid var(--border);border-radius:8px;
    padding:8px;font-family:inherit;font-size:.85rem}
  .additem select,.editform select{border:1px solid var(--border);border-radius:8px;padding:8px;
    font-family:inherit;font-size:.85rem;background:#fff}
  .additem button{background:var(--pine);color:#fff;border:0;border-radius:8px;padding:8px 14px;
    font-weight:600;cursor:pointer;font-family:inherit;font-size:.85rem}
  .editform{padding:12px 14px;display:flex;flex-direction:column;gap:7px;border-top:1px solid var(--border)}
  .editform input,.editform textarea{border:1px solid var(--border);border-radius:8px;padding:8px;
    font-family:inherit;font-size:.85rem;width:100%}
  .editform .row{display:flex;gap:6px}
  .editform .row>*{flex:1;min-width:0}
  .editform .btns{display:flex;gap:6px;margin-top:2px}
  .editform button{background:var(--pine);color:#fff;border:0;border-radius:8px;padding:8px 14px;
    font-weight:600;cursor:pointer;font-family:inherit;font-size:.85rem}
  .editform button.cancel{background:var(--border);color:var(--ink)}
  /* chat */
  #fab{position:fixed;right:16px;bottom:16px;background:var(--pine);color:#fff;border:0;
    border-radius:99px;padding:14px 18px;font-family:inherit;font-weight:600;cursor:pointer;
    box-shadow:0 4px 16px rgba(24,42,32,.25);z-index:20}
  #chat{position:fixed;inset:auto 12px 12px 12px;max-width:700px;margin:0 auto;height:70vh;
    background:#fff;border:1px solid var(--border);border-radius:16px;display:none;
    flex-direction:column;z-index:21;box-shadow:0 8px 40px rgba(24,42,32,.25)}
  #chat.open{display:flex}
  .chat-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;
    align-items:center;justify-content:space-between}
  .chat-log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
  .msg-wrap{display:flex;flex-direction:column;max-width:90%}
  .msg-wrap.end{align-self:flex-end;align-items:flex-end}
  .msg-wrap.start{align-self:flex-start;align-items:flex-start}
  .msg{padding:10px 13px;border-radius:14px;font-size:.92rem;line-height:1.5;
    -webkit-user-select:text;user-select:text;overflow-wrap:anywhere}
  .msg.user{background:var(--pine);color:#fff}
  .msg.assistant{background:var(--pineSoft);color:var(--ink)}
  .msg p{margin:0 0 .55em}
  .msg p:last-child,.msg ul:last-child,.msg ol:last-child{margin-bottom:0}
  .msg ul,.msg ol{margin:.35em 0 .55em;padding-left:1.3em}
  .msg li{margin:.18em 0}
  .msg .mdh{font-weight:700;margin:.2em 0 .35em}
  .msg strong{font-weight:700}
  .msg code{font-family:ui-monospace,Menlo,monospace;font-size:.85em;
    background:rgba(24,42,32,.09);padding:1px 5px;border-radius:5px}
  .msg.user code{background:rgba(255,255,255,.22)}
  .msg a{color:var(--pine);text-decoration:underline;word-break:break-word}
  .msg.user a{color:#fff}
  .msg-copy{margin-top:4px;font-size:.72rem;color:var(--sub);background:none;border:0;
    cursor:pointer;padding:2px 2px;font-family:ui-monospace,Menlo,monospace}
  .msg-copy:hover{color:var(--pine)}
  .chat-in{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border)}
  .chat-in input{flex:1;border:1px solid var(--border);border-radius:10px;padding:10px;font-family:inherit;font-size:.9rem}
  .chat-in button{background:var(--pine);color:#fff;border:0;border-radius:10px;padding:0 16px;font-weight:600;cursor:pointer}
  .muted{color:var(--sub);font-size:.8rem}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">Regal family · Jul 27 – Aug 9, 2026 · 29-ft Class C</div>
  <h1>Seattle → Olympic → Portland → Oregon Coast → Redwoods → SF</h1>
  <div class="muted" id="statusline">Loading live plan…</div>
  <div class="toplinks">
    <a href="/print.html" class="tlink">🖨 Printable itinerary</a>
    <button id="installBtn" class="tlink" style="display:none">⬇ Install app</button>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="timeline">Timeline</button>
    <button class="tab" data-tab="bookings">Bookings</button>
    <button class="tab" data-tab="todo">Open Items</button>
  </div>

  <div id="timeline"></div>
  <div id="bookings" style="display:none"></div>
  <div id="todo" style="display:none"></div>
</div>

<button id="fab">💬 Ask the trip assistant</button>
<div id="chat">
  <div class="chat-head">
    <strong>Trip Assistant</strong>
    <button onclick="toggleChat()" style="border:0;background:transparent;font-size:1.2rem;cursor:pointer">×</button>
  </div>
  <div class="chat-log" id="log">
    <div class="msg-wrap start"><div class="msg assistant">Hi! Ask me anything about the trip — I can check live weather/tides/hours, and I can edit bookings or add to-dos for you.</div></div>
  </div>
  <div class="chat-in">
    <input id="chatInput" placeholder="e.g. What's the weather in Bandon Aug 3?" onkeydown="if(event.key==='Enter')send()"/>
    <button onclick="send()">Send</button>
  </div>
</div>

<script>
let STATE=null;
async function load(){
  try{
    const r=await fetch('/api/state'); const s=await r.json();
    if(!s||!Array.isArray(s.days)) throw new Error(s&&s.error||'no data');
    STATE={days:s.days||[],events:s.events||[],bookings:s.bookings||[],
           openItems:s.openItems||[],changeLog:s.changeLog||[]};
  }catch(e){
    document.getElementById('statusline').textContent=
      'Offline — showing nothing yet. Reconnect to load the plan.';
    return;
  }
  renderTimeline(); renderBookings(); renderTodo();
  document.getElementById('statusline').textContent =
    STATE.bookings.length + ' nights booked · ' + STATE.openItems.length + ' open items';
}
function badge(s){return '<span class="badge b-'+s+'">'+s.toUpperCase()+'</span>';}

function toggleDay(head){
  const b=head.parentElement.querySelector('.day-body');
  b.style.display = b.style.display==='none' ? 'block' : 'none';
}
function mapLink(addr){
  return '<a href="https://maps.google.com/?q='+encodeURIComponent(addr)+'" target="_blank" rel="noopener">'+esc(addr)+'</a>';
}
// Where we sleep each night. Days with no booking of their own (Shabbat /
// travel days) carry forward the most recent night's lodging.
function stayStrip(dayId, dayIdx){
  let b=STATE.bookings.find(x=>x.day_id===dayId), carried=false;
  if(!b){
    for(let i=dayIdx-1;i>=0;i--){
      const prev=STATE.bookings.find(x=>x.day_id===STATE.days[i].day_id);
      if(prev){b=prev;carried=true;break;}
    }
  }
  if(!b) return '<div class="stay"><span class="stay-l">Sleeping</span> <span class="muted">not set</span></div>';
  return '<div class="stay">'+
    '<div><span class="stay-l">🏕 Sleeping</span> <strong>'+esc(b.name)+'</strong>'+
      (carried?' <span class="muted" style="font-size:.78rem">(same as last night)</span>':'')+
      (b.site?' <span class="sitepill">site '+esc(b.site)+'</span>':'')+'</div>'+
    (b.address?'<div class="stay-a">'+mapLink(b.address)+'</div>':'')+
    (b.confirmation||b.phone||b.check_in?'<div class="stay-a muted mono">'+
      [b.confirmation?'conf '+esc(b.confirmation):'',
       b.phone?'<a href="tel:'+esc(b.phone)+'">'+esc(b.phone)+'</a>':'',
       b.check_in?'in '+esc(b.check_in):''].filter(Boolean).join(' · ')+'</div>':'')+
    '</div>';
}
function renderTimeline(){
  const byDay={}; STATE.events.forEach(e=>{(byDay[e.day_id]=byDay[e.day_id]||[]).push(e)});
  const el=document.getElementById('timeline'); el.innerHTML='';
  STATE.days.forEach((d,idx)=>{
    const evs=(byDay[d.day_id]||[]);
    const card=document.createElement('div');
    card.className='card'+(d.status==='shabbat'?' shabbat':'');
    card.innerHTML=
      '<div class="day-head" onclick="toggleDay(this)">'+
        '<div class="t"><div class="date">'+esc(d.date_label)+'</div><div class="title">'+esc(d.title)+'</div></div>'+
        badge(d.status)+'</div>'+
      stayStrip(d.day_id, idx)+
      '<div class="day-body" style="display:none">'+
        evs.map(e=>'<div class="ev"><div class="tm">'+esc(e.time_label||'')+'</div><div class="bd">'+
          '<div class="lb">'+esc(e.label)+'</div>'+(e.note?'<div class="nt">'+esc(e.note)+'</div>':'')+
          (e.link?'<div class="nt"><a href="'+esc(e.link)+'" target="_blank" rel="noopener">'+esc(e.link_label||'link')+'</a></div>':'')+
          '</div></div>').join('')+
      '</div>';
    el.appendChild(card);
  });
}
function esc(s){return (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
async function post(url,body){
  const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
  return r.json();
}
function catOpts(sel){return ['logistics','tank','food','transport'].map(o=>'<option'+(o===sel?' selected':'')+'>'+o+'</option>').join('');}
function statusOpts(sel){return ['booked','backup','shabbat','planned'].map(o=>'<option'+(o===sel?' selected':'')+'>'+o+'</option>').join('');}

// ---- Bookings (with inline edit / delete) ----
let editingBooking=null;
function renderBookings(){
  const el=document.getElementById('bookings'); el.innerHTML='';
  const c=document.createElement('div'); c.className='card';
  c.innerHTML=STATE.bookings.map(b=>{
    if(editingBooking===b.id){
      return '<div class="editform" data-bid="'+b.id+'">'+
        '<input class="bf_name" placeholder="Name">'+
        '<div class="row"><input class="bf_site" placeholder="Site"><input class="bf_conf" placeholder="Confirmation #"></div>'+
        '<div class="row"><select class="bf_status">'+statusOpts(b.status)+'</select><input class="bf_hookups" placeholder="Hookups"></div>'+
        '<textarea class="bf_notes" rows="2" placeholder="Notes"></textarea>'+
        '<div class="btns"><button onclick="saveBooking('+b.id+')">Save</button>'+
        '<button class="cancel" onclick="cancelEditBooking()">Cancel</button></div></div>';
    }
    return '<div class="item"><div style="flex:1"><strong>'+esc(b.date_label)+'</strong> — '+esc(b.name)+
      (b.site?' <span class="mono muted">('+esc(b.site)+')</span>':'')+
      (b.confirmation?'<br><span class="muted mono">conf '+esc(b.confirmation)+'</span>':'')+
      (b.notes?'<br><span class="muted">'+esc(b.notes)+'</span>':'')+'</div>'+
      '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px">'+badge(b.status)+
      '<span class="itembtns"><button class="rowbtn" title="Edit" onclick="editBooking('+b.id+')">✎</button>'+
      '<button class="rowbtn del" title="Delete" onclick="deleteBookingUI('+b.id+')">✕</button></span></div></div>';
  }).join('');
  el.appendChild(c);
  if(editingBooking!=null){
    const ef=c.querySelector('.editform[data-bid="'+editingBooking+'"]');
    const b=STATE.bookings.find(x=>x.id===editingBooking);
    if(ef&&b){ef.querySelector('.bf_name').value=b.name||''; ef.querySelector('.bf_site').value=b.site||'';
      ef.querySelector('.bf_conf').value=b.confirmation||''; ef.querySelector('.bf_status').value=b.status||'booked';
      ef.querySelector('.bf_hookups').value=b.hookups||''; ef.querySelector('.bf_notes').value=b.notes||'';}
  }
}
function editBooking(id){editingBooking=id; renderBookings();}
function cancelEditBooking(){editingBooking=null; renderBookings();}
async function saveBooking(id){
  const ef=document.querySelector('.editform[data-bid="'+id+'"]'); if(!ef)return;
  const cur=STATE.bookings.find(x=>x.id===id)||{};
  await post('/api/booking',{ id,
    name:ef.querySelector('.bf_name').value.trim(),
    site:ef.querySelector('.bf_site').value.trim(),
    confirmation:ef.querySelector('.bf_conf').value.trim(),
    status:ef.querySelector('.bf_status').value,
    hookups:ef.querySelector('.bf_hookups').value.trim(),
    notes:ef.querySelector('.bf_notes').value.trim(),
    // preserve fields not shown in the form so they aren't wiped
    check_in:cur.check_in, check_out:cur.check_out, address:cur.address, phone:cur.phone });
  editingBooking=null; load();
}
async function deleteBookingUI(id){
  if(!confirm('Delete this booking? This cannot be undone.'))return;
  await post('/api/booking/delete',{id}); load();
}

// ---- Open Items (complete / edit / delete / add) ----
let editingItem=null;
function renderTodo(){
  const el=document.getElementById('todo'); el.innerHTML='';
  const c=document.createElement('div'); c.className='card';
  c.innerHTML = STATE.openItems.length ? STATE.openItems.map(i=>{
    if(editingItem===i.id){
      return '<div class="editform" data-eid="'+i.id+'">'+
        '<input class="ei_text" placeholder="To-do text">'+
        '<div class="row"><select class="ei_cat">'+catOpts(i.category)+'</select></div>'+
        '<div class="btns"><button onclick="saveItem('+i.id+')">Save</button>'+
        '<button class="cancel" onclick="cancelEditItem()">Cancel</button></div></div>';
    }
    return '<div class="item">'+
      '<button class="chk" title="Mark done" onclick="resolveItem('+i.id+')">✓</button>'+
      '<span style="flex:1">'+esc(i.text)+'</span>'+
      '<span class="muted mono">'+esc(i.category||'')+'</span>'+
      '<span class="itembtns"><button class="rowbtn" title="Edit" onclick="editItem('+i.id+')">✎</button>'+
      '<button class="rowbtn del" title="Delete" onclick="deleteItem('+i.id+')">✕</button></span></div>';
  }).join('') : '<div class="item">All clear — no open items 🎉</div>';
  const add=document.createElement('div'); add.className='additem';
  add.innerHTML='<input id="newItemText" placeholder="Add a to-do…" onkeydown="if(event.key===\'Enter\')addItem()">'+
    '<select id="newItemCat">'+catOpts('logistics')+'</select>'+
    '<button onclick="addItem()">Add</button>';
  c.appendChild(add);
  el.appendChild(c);
  if(editingItem!=null){
    const ef=c.querySelector('.editform[data-eid="'+editingItem+'"]');
    const it=STATE.openItems.find(x=>x.id===editingItem);
    if(ef&&it){ef.querySelector('.ei_text').value=it.text||''; ef.querySelector('.ei_cat').value=it.category||'logistics';}
  }
}
function editItem(id){editingItem=id; renderTodo();}
function cancelEditItem(){editingItem=null; renderTodo();}
async function resolveItem(id){await post('/api/open-item',{resolveId:id}); load();}
async function deleteItem(id){if(!confirm('Delete this item?'))return; await post('/api/open-item',{deleteId:id}); load();}
async function saveItem(id){
  const ef=document.querySelector('.editform[data-eid="'+id+'"]'); if(!ef)return;
  const t=ef.querySelector('.ei_text').value.trim();
  if(!t){editingItem=null; renderTodo(); return;}
  await post('/api/open-item',{editId:id,text:t,category:ef.querySelector('.ei_cat').value});
  editingItem=null; load();
}
async function addItem(){
  const t=document.getElementById('newItemText').value.trim(); if(!t)return;
  await post('/api/open-item',{text:t,category:document.getElementById('newItemCat').value});
  load();
}

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  ['timeline','bookings','todo'].forEach(id=>document.getElementById(id).style.display='none');
  document.getElementById(t.dataset.tab).style.display='block';
});

// ---- chat ----
function toggleChat(){document.getElementById('chat').classList.toggle('open');loadHistory();}
document.getElementById('fab').onclick=toggleChat;
let historyLoaded=false;
async function loadHistory(){
  if(historyLoaded) return; historyLoaded=true;
  try{const r=await fetch('/api/chat/history');const {messages}=await r.json();
    messages.forEach(m=>addMsg(m.role,m.content));}catch(e){}
}
// --- tiny, safe Markdown renderer (escape first, then format) ---
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function mdInline(t){
  t=t.replace(/`([^`]+)`/g,'<code>$1</code>');
  t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  t=t.replace(/__([^_]+)__/g,'<strong>$1</strong>');
  t=t.replace(/(^|[^*])\*(?!\s)([^*\n]+?)\*/g,'$1<em>$2</em>');
  // [text](url) markdown links
  t=t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  // bare URLs — only at start / after a space or "(", so a URL already inside
  // an href="..." from the line above is never wrapped a second time.
  t=t.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  return t;
}
function mdToHtml(src){
  const lines=escapeHtml(src).split(/\r?\n/); let out='',i=0;
  const isUl=l=>/^\s*[-*]\s+/.test(l), isOl=l=>/^\s*\d+\.\s+/.test(l),
        isBlank=l=>/^\s*$/.test(l), isH=l=>/^\s*#{1,6}\s+/.test(l);
  while(i<lines.length){
    const line=lines[i], h=line.match(/^\s*(#{1,6})\s+(.*)/);
    if(h){out+='<p class="mdh">'+mdInline(h[2])+'</p>';i++;continue;}
    if(isUl(line)){out+='<ul>';
      while(i<lines.length&&isUl(lines[i])){out+='<li>'+mdInline(lines[i].replace(/^\s*[-*]\s+/,''))+'</li>';i++;}
      out+='</ul>';continue;}
    if(isOl(line)){out+='<ol>';
      while(i<lines.length&&isOl(lines[i])){out+='<li>'+mdInline(lines[i].replace(/^\s*\d+\.\s+/,''))+'</li>';i++;}
      out+='</ol>';continue;}
    if(isBlank(line)){i++;continue;}
    const para=[];
    while(i<lines.length&&!isBlank(lines[i])&&!isUl(lines[i])&&!isOl(lines[i])&&!isH(lines[i])){para.push(lines[i]);i++;}
    out+='<p>'+para.map(mdInline).join('<br>')+'</p>';
  }
  return out;
}
function renderMsg(el,role,text){
  el.innerHTML = role==='assistant' ? mdToHtml(text) : escapeHtml(text).replace(/\n/g,'<br>');
}
function copyBtn(text){
  const b=document.createElement('button');b.className='msg-copy';b.textContent='⧉ Copy';
  b.onclick=()=>{
    const done=()=>{b.textContent='✓ Copied';setTimeout(()=>b.textContent='⧉ Copy',1500);};
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(()=>b.textContent='(select to copy)');
    else b.textContent='(select to copy)';
  };
  return b;
}
function addMsg(role,text){
  const log=document.getElementById('log');
  const wrap=document.createElement('div');wrap.className='msg-wrap '+(role==='user'?'end':'start');
  const d=document.createElement('div');d.className='msg '+role;renderMsg(d,role,text);
  wrap.appendChild(d);
  if(role==='assistant'&&text) wrap.appendChild(copyBtn(text));
  log.appendChild(wrap);log.scrollTop=log.scrollHeight;
}
async function send(){
  const inp=document.getElementById('chatInput');const text=inp.value.trim();if(!text)return;
  inp.value='';addMsg('user',text);
  const log=document.getElementById('log');
  const wrap=document.createElement('div');wrap.className='msg-wrap start';
  const thinking=document.createElement('div');thinking.className='msg assistant';thinking.textContent='…';
  wrap.appendChild(thinking);log.appendChild(wrap);log.scrollTop=log.scrollHeight;
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({message:text})});
    const data=await r.json();
    const reply=data.reply||data.error||'(no response)';
    renderMsg(thinking,'assistant',reply);
    wrap.appendChild(copyBtn(reply));
    log.scrollTop=log.scrollHeight;
    load(); // refresh state in case the assistant edited a booking
  }catch(e){thinking.textContent='Error: '+e.message;}
}
load();

// ---- installable app (PWA) ----
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
}
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',(e)=>{
  e.preventDefault(); deferredPrompt=e;
  const b=document.getElementById('installBtn'); if(b) b.style.display='inline-block';
});
(function(){
  const b=document.getElementById('installBtn');
  if(b) b.onclick=async()=>{
    if(!deferredPrompt)return;
    deferredPrompt.prompt(); await deferredPrompt.userChoice;
    deferredPrompt=null; b.style.display='none';
  };
})();
window.addEventListener('appinstalled',()=>{const b=document.getElementById('installBtn'); if(b) b.style.display='none';});
</script>
